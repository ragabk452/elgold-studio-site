  <style>
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: var(--navy-800); overflow: hidden; }
    .nf { position: relative; z-index: 2; text-align: center; padding: var(--s-40); display: flex; flex-direction: column; align-items: center; gap: var(--s-20); }
    .nf__mark { width: 72px; height: 72px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; color: var(--cream); border: 1.5px solid rgba(244,238,223,.45); border-radius: 18px; background: rgba(10,19,48,.55); box-shadow: 0 0 60px 8px var(--glow), inset 0 0 24px rgba(244,238,223,.07); }
    .nf__code { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.6rem, 12vw, 6rem); line-height: 1; color: var(--cream); letter-spacing: .02em; }
    .nf__msg { color: rgba(244,238,223,.62); font-size: 1.05rem; line-height: 1.9; max-width: 30ch; }
    .nf__msg span { display: block; font-family: var(--font-en); font-size: .92rem; opacity: .7; }
    .nf__cta { display: flex; gap: var(--s-12); flex-wrap: wrap; justify-content: center; margin-top: var(--s-8); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg__aurora"></div><div class="bg__grid"></div><div class="bg__noise"></div></div>
  <main class="nf">
    <i class="nf__mark" aria-hidden="true">G</i>
    <div class="nf__code">404</div>
    <p class="nf__msg">الصفحة اللي بتدوّر عليها مش موجودة.<span>The page you’re looking for doesn’t exist.</span></p>
    <div class="nf__cta">

      <a href="work.html" class="btn btn--ghost btn--lg magnetic">الأعمال · Work</a>
    </div>
  </main>
</body>
